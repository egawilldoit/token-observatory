name: One-shot lockfile refresh

on:
  push:
    branches:
      - fix/post-merge-hardening-01
    paths:
      - .github/workflows/lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Add locked tsx test runner
        run: |
          npm pkg set 'scripts.test=tsx --test tests/*.test.ts'
          npm install --save-dev --save-exact --package-lock-only --ignore-scripts tsx@4.23.12
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: lock tsx test runner"
          git push origin HEAD:fix/post-merge-hardening-01
